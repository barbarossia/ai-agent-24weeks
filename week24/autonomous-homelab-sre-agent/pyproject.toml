[project]
name = "autonomous-homelab-sre-agent"
version = "0.1.0"
description = "Offline, approval-gated Week 24 HomeLab SRE agent portfolio lab"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "mcp>=2,<3",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
w24-sre = "autonomous_homelab_sre_agent.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_homelab_sre_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
pythonpath = ["src"]
