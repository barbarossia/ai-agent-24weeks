[project]
name = "week18-observability-lab"
version = "0.1.0"
description = "Week 18: offline tracing, Prometheus metrics, and deterministic fault injection"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
week18-observe = "week18_observability_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/week18_observability_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
