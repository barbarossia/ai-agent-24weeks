[project]
name = "tool-calling-lab"
version = "0.1.0"
description = "Week 4 - Function / Tool Calling：一个最小、可运行、可解释的端到端例子（全程 mock，无需 API key）"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "barbarossia" }]
dependencies = [
    # 工具参数用 Pydantic 校验，与 Week 3 的结构化输出校验方式一致。
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
tool-calling-lab = "tool_calling_lab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_calling_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
