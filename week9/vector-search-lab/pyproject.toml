[project]
name = "vector-search-lab"
version = "0.1.0"
description = "Week 9 - Embedding and Vector Search Lab: Ingestion, Chunking, Cosine Similarity, and Vector Stores"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "barbarossia" }]
dependencies = [
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24",
]

[project.scripts]
vector-search-lab = "vector_search_lab.cli:main"
vector-search-demo = "vector_search_lab.cli:run_demo_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vector_search_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
