[project]
name = "mcp-fundamentals-lab"
version = "0.1.0"
description = "Week 7 - MCP Fundamentals: Minimal runnable MCP Server and Client covering Tools, Resources, and Prompts"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "barbarossia" }]
dependencies = [
    "mcp==1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mcp-server = "mcp_fundamentals_lab.server:main"
mcp-client = "mcp_fundamentals_lab.client:main"
mcp-lab = "mcp_fundamentals_lab.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_fundamentals_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
