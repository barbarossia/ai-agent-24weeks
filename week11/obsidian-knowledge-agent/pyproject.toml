[project]
name = "obsidian-knowledge-agent"
version = "0.1.0"
description = "Explicit single-note ingestion and PostgreSQL vector retrieval"
requires-python = ">=3.12"
dependencies = ["vector-search-lab", "psycopg[binary]>=3.2,<4", "PyYAML>=6,<7", "httpx>=0.28,<1"]

[tool.uv.sources]
vector-search-lab = { path = "../../week9/vector-search-lab", editable = true }

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
obsidian-agent = "obsidian_knowledge_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: opt-in live PostgreSQL tests"]
