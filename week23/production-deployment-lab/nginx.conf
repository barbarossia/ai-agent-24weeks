worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format lab '$request_method status=$status upstream_time=$upstream_response_time trace_id=$upstream_http_x_trace_id';
    access_log /dev/stdout lab;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 16k;
    sendfile on;
    keepalive_timeout 10s;

    upstream agent_api {
        server api:8000;
        keepalive 8;
    }

    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /run/secrets/local_tls_crt;
        ssl_certificate_key /run/secrets/local_tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header traceparent $http_traceparent;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_pass http://agent_api;
        }
    }
}
