[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "week23-production-deployment-lab"
version = "0.1.0"
description = "A local-only durable synthetic Agent API deployment lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "opentelemetry-api==1.31.1",
  "opentelemetry-exporter-otlp-proto-grpc==1.31.1",
  "opentelemetry-sdk==1.31.1",
  "prometheus-client==0.21.1",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
]

[project.scripts]
week23-eval = "week23_production_lab.eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
