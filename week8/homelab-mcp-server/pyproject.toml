[project]
name = "homelab-mcp-server"
version = "0.1.0"
description = "Week 8 - HomeLab MCP Server: Read-only MCP Server with Mock and Real HTTP Adapters"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "barbarossia" }]
dependencies = [
    "mcp==1.3.0",
    "httpx>=0.28.1",
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24",
]

[project.scripts]
homelab-mcp-server = "homelab_mcp_server.server:main"
homelab-mcp-demo = "homelab_mcp_server.demo_client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
