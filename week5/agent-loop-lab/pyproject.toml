[project]
name = "agent-loop-lab"
version = "0.1.0"
description = "Week 5 - 手写 Agent Loop：不依赖框架的多步 ReAct 风格 Agent Loop（全程 mock，无需 API key）"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "barbarossia" }]
dependencies = [
    # 工具参数用 Pydantic 校验，与 Week 3/4 的校验方式一致。
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
agent-loop-lab = "agent_loop_lab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_loop_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
