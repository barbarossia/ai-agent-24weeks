[project]
name = "week22-a2a-lab"
version = "0.1.0"
description = "Deterministic local A2A interoperability lab using the official Python SDK"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]==1.1.5",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
week22-a2a-demo = "week22_a2a_lab.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/week22_a2a_lab"]
