[project]
name = "ai-agent-lab"
version = "0.1.0"
description = "Week 1 - 面向 AI Agent Engineer 的 typed Python CLI（HomeLab 主机状态检查）"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "barbarossia" }]
dependencies = [
    "pydantic>=2.9,<3",
]

# PEP 735 dependency groups：开发期依赖，不进入运行时包。
# uv sync 默认会安装 dev 组。
[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
# 安装后可直接执行：uv run ai-agent-lab check-all
ai-agent-lab = "ai_agent_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
